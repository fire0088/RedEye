# REDEYE configuration.
# Command-line flags (--size, --no-crt, --no-sound, ...) override these.
# Edit this file instead of remembering CLI options.

[display]
size       = 1360x820
crt        = true
fullscreen = false

[audio]
enabled = true
volume  = 0.8

[aws]
# Leave profile/model blank to choose them on the boot screen.
# Set them to skip straight past selection.
profile = 
region  = us-east-1
model   = 

[paths]
# Paths are resolved relative to this config file's directory.
mcp_config = mcp_config.json
db         = redeye.db
exports    = exports

[vault]
# Encrypt stored credentials/secrets at rest (recommended for real engagements).
# The passphrase is read from the REDEYE_VAULT_PASSPHRASE environment variable
# first; only fall back to writing it below if you accept the lower security.
# If encrypt = true but no passphrase is available, the vault stays plaintext
# and warns you.
encrypt    = false
passphrase = 

[jira]
# Optional. If base_url + email + token are set, "create jira ticket" on a
# finding POSTs a real issue; otherwise it writes an importable JSON payload to
# the exports folder. The token is read from REDEYE_JIRA_TOKEN first.
# base_url example: https://yourorg.atlassian.net
base_url =
project  = SEC
email    =
token    =

[server]
# Backend daemon (serve.py). The Godot front-end connects here.
# host = 0.0.0.0 lets other machines on your network connect.
# password is (re)generated each startup and written below; any username plus
# this password may connect. Pass --keep-password to serve.py to stop rotating.
host     = 127.0.0.1
port     = 8787
password =

[tools]
# On startup the backend checks each scanner binary (nmap, nuclei, wapiti).
# If a tool is missing and auto_install is true, it makes a best-effort,
# non-interactive install attempt; anything it can't install shows a warning
# icon in the client (the matching MCP server still works in mock mode).
auto_install = true

[scope]
# Engagement scope: comma-separated authorised targets. RED and the tools will
# refuse to scan/probe anything outside this list; the inventory still shows
# everything, flagged in/out of scope. Empty = unrestricted.
# Examples: 10.0.0.0/24, 192.168.1.0/24, *.corp.example.com
targets =

[correlate]
# Read-time correlation identity keys (strong = auto-merge). Vendor-agnostic:
# assets sharing any of these normalized fields are merged into one node.
# resource_id = the native id after the "vendor:" prefix (e.g. i-0a1b2c3d).
keys = ip, hostname, resource_id

[approval]
# Dangerous tools (name contains any of these) are blocked until an operator
# ARMS them in the console. Comma-separated substrings.
dangerous = brute, spray, exploit, probe, attack, login, password, cred, shell, rce, inject

[engagement]
# Report cover metadata (optional). Also settable live from the app.
client =
tester =
window =
contact =
